# SonarQube Cloud configuration for @zanreal/search.
#
# Analysis runs from CI (.github/workflows/sonarqube.yml), not from SonarCloud's
# Automatic Analysis. Automatic mode cannot read coverage reports at all, and
# feeding it the bun lcov report is the entire point of this setup. The two
# modes are mutually exclusive: Automatic Analysis must be turned off for
# zanreal-labs_search under project Administration > Analysis Method, or the
# scanner rejects every submission.
#
# The organization key is `zanreal`, which is NOT the GitHub org slug
# (`zanreal-labs`). Project keys do carry the GitHub prefix. Verified against
# https://sonarcloud.io/api/organizations/search?organizations=zanreal - the
# sibling projects zanreal-labs_search / _nemo / _devcontainer all live there.
# The previous version of this file declared `zanreal-labs`, which is not an
# organization key; it never mattered, because Automatic Analysis ignores this
# file entirely.
sonar.projectKey=zanreal-labs_search
sonar.organization=zanreal
sonar.sourceEncoding=UTF-8

# The published library is one file, src/index.ts, and its suite lives in
# tests/. Those are the only two trees worth measuring, and they are disjoint,
# so nothing can be indexed as both a main file and a test file.
#
# Everything else is out of scope by omission rather than by exclusion:
# benchmarks/ (8 harness scripts), examples/ (7 documentation scripts), docs/
# (MDX for the website), dist/ (build output). Those trees are what the old
# configuration spent nearly all of its analysis on: 15 of the 16 non-test
# TypeScript files in this repository live in benchmarks/ and examples/, 2397 of
# 2987 non-test lines, so the quality metrics described demo code rather than
# the library.
sonar.sources=src
sonar.tests=tests

# Redundant while sonar.sources stays at `src`, and kept deliberately so the
# intent survives someone widening it later. Demo and benchmark scripts are
# written to be read, not maintained: they log to the console, hardcode
# fixtures and swallow errors on purpose, and issues raised against them are
# not actionable.
sonar.exclusions=\
  benchmarks/**, \
  examples/**, \
  docs/**, \
  dist/**, \
  coverage/**, \
  node_modules/**, \
  **/*.d.ts

sonar.test.exclusions=\
  dist/**, \
  coverage/**, \
  node_modules/**

# Written by `bun test --coverage`. The lcov reporter and the output directory
# are declared in bunfig.toml, not on the command line. Paths inside the report
# are already relative to the repository root (`SF:src/index.ts`), so unlike the
# zanreal-web monorepo this needs no path rewriting before the scan.
#
# sonar.javascript.lcov.reportPaths covers TypeScript as well; the separate
# sonar.typescript.lcov.reportPaths key that used to be set here is deprecated,
# and setting both only risks the two drifting apart.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# No sonar.coverage.exclusions on purpose. src/index.ts is the only main file
# and it sits at 99.4% line coverage, so there is nothing worth hiding from the
# metric. The long list this file used to carry was inherited from a Next.js
# application template - **/*.tsx, **/*.js, **/app/**, middleware.ts,
# supabase/**, payload-types.ts, **/*.pyc and the rest - and matched nothing in
# this repository.
