version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '12:00'
    pull-request-branch-name:
      separator: '-'
    open-pull-requests-limit: 10
    labels:
      - type:actions
    ignore:
      # changesets/action v2 needs @changesets/cli v3; bump both together by hand.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
