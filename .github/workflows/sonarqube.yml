# SonarQube Cloud analysis, driven from CI so that bun test coverage is included.
#
# SonarCloud's Automatic Analysis cannot read coverage reports, so this workflow
# replaces it. Two things the repository owner has to do before a scan can
# succeed:
#
#   1. Set the SONAR_TOKEN secret to a token scoped to the `zanreal`
#      organization (`gh secret set SONAR_TOKEN --repo zanreal-labs/search`).
#   2. Disable Automatic Analysis for zanreal-labs_search under project
#      Administration > Analysis Method. The two modes are mutually exclusive;
#      with the token present but automatic mode still on, the scanner refuses
#      the submission with "You are running manual analysis while Automatic
#      Analysis is enabled".
#
# Until step 1 is done this workflow self-skips and reports green, so it cannot
# turn CI red on anyone's pull request in the meantime.
#
# Leak-period gotcha for anyone whose pull request the quality gate blocks:
# touching a line that already contained a hotspot (a bare Math.random, say)
# moves that hotspot into your new-code period and it becomes yours to answer
# for. Avoid cosmetic edits to such lines, or fix the hotspot properly.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets cannot be read from a job-level `if:`, so token presence is probed
  # in a job of its own and the scan depends on its output. A missing SONAR_TOKEN
  # is a configuration state, not a broken pull request: the scan is skipped,
  # never failed. The same applies to pull requests from forks, which never get
  # the secret at all.
  guard:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege, declared per job as Sonar's githubactions:S8264 asks.
    # This job touches nothing but its own step output.
    permissions: {}
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}

    steps:
      - name: Detect SONAR_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=SonarQube skipped::SONAR_TOKEN is not set on this repository, so no analysis was submitted. Set the secret to enable the scan."
          fi

  sonarqube:
    name: Scan
    needs: guard
    if: needs.guard.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only: the scan clones the repository and submits results to
    # SonarQube Cloud with SONAR_TOKEN. Pull request decoration is posted by
    # the SonarCloud GitHub App, not by this workflow's token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar needs the full history to attribute blame and to resolve the
          # new code period; a shallow clone silently degrades both.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts keeps install lifecycle hooks out of the scan job,
      # which is what Sonar's githubactions:S6505 asks for. Free here: no
      # workspace in this repository declares a postinstall or prepare hook.
      # Matches the install in tests.yml and release.yml.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Deliberately not continue-on-error. Coverage measured against a red
      # suite is not worth publishing, so a failing test fails this workflow.
      #
      # The lcov reporter and the coverage/ output directory come from
      # bunfig.toml's [test] block, not from flags. Passing
      # --coverage-reporter / --coverage-dir here would be a silent no-op:
      # verified on bun 1.3.12, a key present in bunfig.toml wins over the
      # matching command line flag. bunfig.toml is the place to change either.
      - name: Run tests with coverage
        run: bun test --coverage

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          # SONAR_HOST_URL is deliberately unset: the action targets SonarQube
          # Cloud by default and only needs the URL for self-hosted servers.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
