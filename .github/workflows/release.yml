name: Release

on:
  push:
    branches:
      - main

# Scoped to what changesets/action actually needs: it pushes the version bump and tags
# (contents), opens the release pull request (pull-requests), and npm provenance is minted from
# the OIDC token (id-token), which `publishConfig.provenance` requires at publish time.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # This job holds NPM_TOKEN, so it is the one place a dependency lifecycle script would be
      # most valuable to an attacker. Install exactly what the lockfile resolves and run none of
      # them; the release build needs neither.
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # `bun run release` builds and then calls `changeset publish`, which shells out to
      # `npm publish`. npm, not `bun publish`, is what honours `publishConfig.provenance`.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
