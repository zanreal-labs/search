name: Release

on:
  push:
    branches:
      - main

# Scoped to what changesets/action actually needs: it pushes the version bump and tags
# (contents), opens the release pull request (pull-requests), and npm provenance is minted from
# the OIDC token (id-token), which `publishConfig.provenance` requires at publish time.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # bun installs the dependencies, but `changeset publish` shells out to `npm publish`,
      # so npm is what actually talks to the registry - and it needs two things bun cannot
      # provide. This step writes the .npmrc pointing at npmjs.org, which is how npm derives
      # the OIDC *audience* for trusted publishing, and it also pins Node 22: npm 11 refuses
      # to run on the Node the runner would otherwise pick for it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ubuntu-latest ships npm 10, which can sign provenance but cannot perform the trusted
      # publishing token exchange - that landed in npm 11.5.1. Without this the OIDC exchange
      # never happens, npm silently falls back to NPM_TOKEN, and the failure surfaces as an
      # E404 on PUT rather than anything mentioning authentication.
      - name: Use npm 11
        run: npm install -g "npm@^11.5.1"

      # This job holds NPM_TOKEN, so it is the one place a dependency lifecycle script would be
      # most valuable to an attacker. Install exactly what the lockfile resolves and run none of
      # them; the release build needs neither.
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # `bun run release` builds and then calls `changeset publish`, which shells out to
      # `npm publish`. npm, not `bun publish`, is what honours `publishConfig.provenance`.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
